services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-operations-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_operations}
      POSTGRES_USER: ${POSTGRES_USER:-ai_operations}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-locally}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ai_operations} -d ${POSTGRES_DB:-ai_operations}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
